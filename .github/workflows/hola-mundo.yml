name: Hola Mundo

on: 
  workflow_dispatch: #jecucion manual
  push:
    branches:
      - main
    paths:
      - 'BibliotecaApi/**'
      - 'BibliotecaApiTest/**'
      - '.github/workflows/hola-mundo.yml'
  pull_request:
    branches:
      - main
    
jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      - name: Muestra mensaje hola mundo
        run: echo "hola mundo, tomy"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Listar los archivos del repositorio
        run: |
          echo "El repositorio ${{ github.repository }} contiene los siguientes archivos:"
          tree
